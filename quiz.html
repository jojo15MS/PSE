<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz PSE – formateur / stagiaire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#0c2238;--mut:#58697b;--navy:#0e2a47;--red:#d62828;--ok:#16864b;--warn:#c98a00;--line:#d3dae3;--blue:#1f4fa3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1626;--card:#112540;--ink:#e9eff6;--mut:#9aaabc;--navy:#06111f;--red:#ff5252;--ok:#38d083;--warn:#ffc233;--line:#24405f;--blue:#6c9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1626;--card:#112540;--ink:#e9eff6;--mut:#9aaabc;--navy:#06111f;--red:#ff5252;--ok:#38d083;--warn:#ffc233;--line:#24405f;--blue:#6c9bff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 16px}
.top img{width:60px;height:60px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff}
.top h1{margin:0;font:700 1.7rem/1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em}
.top p{margin:4px 0 0;font-size:.9rem;opacity:.8}
.tri{height:6px;background:linear-gradient(90deg,#1f4fa3 0 33.4%,#fff 33.4% 66.7%,#d62828 66.7%)}
#app{max-width:680px;margin:0 auto;padding:14px 14px 40px}
h2{font:700 1.25rem/1.2 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0 0 10px}
.sec{margin:20px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut);font-size:.92rem}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--navy);border-radius:6px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.seg button{font:600 1rem "Barlow",system-ui,sans-serif;padding:11px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.b{font:600 1rem "Barlow",system-ui,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:6px;padding:10px 16px;cursor:pointer;min-height:44px}
.b.p{background:var(--red);border-color:var(--red);color:#fff}
.b.s{padding:7px 12px;min-height:36px;font-size:.9rem}
.b:active,.o:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-block;font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
input[type=text]{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin:6px 0 12px}
.q{font:600 1.4rem/1.3 "Barlow",system-ui,sans-serif;margin:10px 0 14px}
.o{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:500 1.05rem/1.3 "Barlow",system-ui,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:6px;padding:12px;margin:0 0 10px;min-height:58px;cursor:pointer}
.o .k{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--bg);font:700 1rem "Barlow Condensed",system-ui,sans-serif;border:1px solid var(--line)}
.o.sel{border-color:var(--navy);background:var(--bg)}.o.sel .k{background:var(--navy);color:#fff}
.o.ok{border-color:var(--ok)}.o.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.o.ko{border-color:var(--red)}.o.ko .k{background:var(--red);color:#fff;border-color:var(--red)}
.o:disabled{cursor:default}
.ring{position:relative;width:92px;height:92px;margin:0 auto 4px}
.ring svg{width:100%;height:100%}
.ring circle{fill:none;stroke-width:8}.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--navy);stroke-linecap:round;stroke-dasharray:264;transition:stroke-dashoffset .3s linear}
[data-theme="dark"] .ring .fg{stroke:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ring .fg{stroke:#fff}}
.ring .fg.w{stroke:var(--warn)}.ring .fg.r{stroke:var(--red)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 2.1rem "Barlow Condensed",system-ui,sans-serif}
.res{padding:10px 12px;border-radius:6px;font-weight:600;margin:4px 0 10px;border-left:6px solid var(--line);background:var(--bg)}
.res.ok{border-color:var(--ok)}.res.ko{border-color:var(--red)}
.wait{text-align:center;padding:30px 16px}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--red);margin:0 auto 12px;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.5);opacity:.5}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.ring .fg{transition:none}}
.d{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 24px;gap:8px;align-items:center;margin:6px 0;font-size:.95rem}
.d i{display:block;height:14px;background:var(--line);border-radius:3px;min-width:3px}.d.g i{background:var(--ok)}
.d span{overflow-wrap:anywhere}
.lead td:first-child{width:28px;font-weight:700;color:var(--mut)}
table{width:100%;border-collapse:collapse}td{padding:7px 4px;border-top:1px solid var(--line)}td:last-child{text-align:right;font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600;padding:12px 14px;display:flex;justify-content:space-between;gap:8px}
.items{padding:0 14px 10px}
.r{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.r label{flex:1;display:flex;gap:10px;align-items:flex-start;font-size:.97rem;cursor:pointer}
.r input{width:20px;height:20px;margin-top:1px;flex:none}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>

const Q=[];let seed=7;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
for(const th in D)for(const [q,o] of D[th]){
 if(typeof o==="boolean")Q.push({th,q,o:["Vrai","Faux"],a:o?0:1});
 else{const ix=o.map((_,i)=>i);for(let i=ix.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[ix[i],ix[j]]=[ix[j],ix[i]]}
  Q.push({th,q,o:ix.map(i=>o[i]),a:ix.indexOf(0)})}}


let db,user,uid,isT=false,sess=null,ans=[],mine={},name="",endAt=0,lastSeq=-1,sel=new Set(),qp=-1,cur=-1,wasAct=true,rsT=0;
const sRef=()=>db.doc("session/current");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),3200)}
let showLb=true,off=0,qinfo={pos:-1,total:0},INFO={urls:[]};
let PIN="";try{PIN=sessionStorage.getItem("pse_pin")||""}catch(e){}
async function api(p,b){const r=await fetch("/api/"+p,{method:"POST",headers:{"Content-Type":"application/json","x-pin":PIN},body:JSON.stringify(b||{})});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.err||r.status)}return r.json()}
async function join(code,nm){const j=await api("join",{code,name:nm,uid});uid=j.uid;mine=j.r||{};try{localStorage.setItem("pse_uid",uid);localStorage.setItem("pse_code",code||"")}catch(e){}}
async function init(){
 try{INFO=await(await fetch("/api/info",{headers:{"x-pin":PIN}})).json()}catch(e){$("#main").innerHTML='<div class="card wait">Serveur injoignable. Vérifie que le formateur a lancé le serveur.</div>';return}
 isT=INFO.isT;
 try{name=localStorage.getItem("pse_name")||"";uid=localStorage.getItem("pse_uid")||""}catch(e){}
 if(name&&uid){try{await join(localStorage.getItem("pse_code")||"",name)}catch(e){name="";uid=""}}
 $("#main").innerHTML=(isT?'<div class="seg"><button class="on" id="t1">Formateur</button><button id="t2">Stagiaire</button></div>':"")+'<div id="fv"></div><div id="tv"></div>';
 if(PIN&&!isT){try{sessionStorage.removeItem("pse_pin")}catch(e){}toast("Code formateur incorrect")}
 if(!isT&&INFO.hasPin){$("#main").insertAdjacentHTML("beforeend",'<p class="mut" style="margin:24px 0 0;text-align:center"><a href="#" id="ft">Accès formateur</a></p>');$("#ft").onclick=e=>{e.preventDefault();const x=prompt("Code formateur");if(x){try{sessionStorage.setItem("pse_pin",x)}catch(err){}location.reload()}}}
 if(isT){buildTrainer();$("#tv").style.display="none";$("#t1").onclick=()=>tab(1);$("#t2").onclick=()=>tab(2)}
 else $("#fv").style.display="none";
 const es=new EventSource("/events"+(isT?"?t=1&pin="+encodeURIComponent(PIN):""));
 es.onmessage=e=>{const m=JSON.parse(e.data);off=m.now-Date.now();sess=m.sess;qinfo=m.q;if(m.players)ans=m.players;
  if(!sess){lastSeq=-1;mine={}}
  else if(sess.seq!==lastSeq){const first=lastSeq===-1;lastSeq=sess.seq;if(sess.state==="open"){endAt=sess.t+T*1000-off;if(!first)delete mine[sess.id]}}
  live();tr()};
 setInterval(tick,300);tr();
}
function tab(n){$("#fv").style.display=n==1?"":"none";$("#tv").style.display=n==2?"":"none";$("#t1").classList.toggle("on",n==1);$("#t2").classList.toggle("on",n==2)}

/* ---------- Formateur ---------- */
function buildTrainer(){
 let h='<div class="card"><h2>Rejoindre la séance</h2><p style="margin:0">Adresse : <b>'+(INFO.urls.map(esc).join(" ou ")||"réseau non détecté")+'</b></p><p style="margin:8px 0 0;font:700 2.4rem/1 Barlow Condensed,sans-serif;letter-spacing:.12em">Code : '+esc(INFO.code)+'</p></div><div class="card" id="lv"></div><div class="card"><div class="hrow"><h2>File d’envoi</h2><span class="chip" id="ns">0 question</span></div><p class="mut" style="margin:0">Coche des questions puis lance l’enchaînement : chaque question dure 20 s, la correction s’affiche, puis la suivante part toute seule. « Envoyer » lance une question isolée.</p><div class="row"><button class="b p" id="go">Lancer la sélection</button><button class="b" id="nx">Passer à la suivante</button><button class="b" id="st">Arrêter</button><button class="b" id="cl">Tout décocher</button></div></div><h2 class="sec">Banque de questions ('+Q.length+')</h2>';
 let i=0;
 for(const th in D){h+='<details><summary><span>'+esc(th)+'</span><span class="chip">'+D[th].length+'</span></summary><div class="items"><div class="row" style="margin:0 0 6px"><button class="b s" data-all="'+esc(th)+'">Tout cocher</button></div>';
  for(let k=0;k<D[th].length;k++,i++)h+='<div class="r"><label><input type="checkbox" data-i="'+i+'"><span>'+esc(Q[i].q)+'</span></label><button class="b s p" data-s="'+i+'">Envoyer</button></div>';
  h+='</div></details>'}
 $("#fv").innerHTML=h;
 $("#fv").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.s!==undefined)send(+b.dataset.s);
  if(b.dataset.all!==undefined){b.closest("details").querySelectorAll("input[data-i]").forEach(c=>{c.checked=true;sel.add(+c.dataset.i)});cnt()}};
 $("#fv").onchange=e=>{const i=e.target.dataset.i;if(i===undefined)return;e.target.checked?sel.add(+i):sel.delete(+i);cnt()};
 $("#go").onclick=()=>{if(!sel.size){toast("Coche d’abord des questions.");return}api("queue",{ids:[...sel].sort((a,b)=>a-b)}).then(()=>toast("Enchaînement lancé")).catch(()=>toast("Lancement impossible"))};
 $("#nx").onclick=()=>api("next").catch(()=>toast("Action impossible"));$("#st").onclick=()=>api("stop").then(()=>toast("Enchaînement arrêté")).catch(()=>toast("Action impossible"));
 $("#cl").onclick=()=>{sel.clear();document.querySelectorAll("#fv input").forEach(c=>c.checked=false);cnt()};
}
function cnt(){$("#ns").textContent=sel.size+(sel.size>1?" questions":" question")}

async function send(id){try{await api("send",{id});toast("Question envoyée")}catch(e){toast("Envoi impossible")}}
async function reveal(){try{await api("reveal")}catch(e){toast("Action impossible")}}
async function reset(){try{await api("reset");toast("Scores remis à zéro")}catch(e){toast("Remise à zéro impossible")}}
function live(){if(!isT)return;const el=$("#lv");if(!el)return;
 let h='<h2>En direct</h2>';
 if(sess){const q=Q[sess.id],open=sess.state==="open";
  const c=q.o.map(()=>0);let n=0;ans.forEach(a=>{const v=a.r&&a.r[sess.id];if(v!==undefined&&c[v]!==undefined){c[v]++;n++}});
  h+='<span class="chip">'+esc(q.th)+'</span><p class="q" style="font-size:1.2rem;margin:10px 0">'+esc(q.q)+'</p><p class="mut" style="margin:0 0 8px">'+(open?'Ouverte, <b id="cd"></b> s restantes':'Clôturée')+' · '+n+' réponse'+(n>1?'s':'')+(qinfo.total?' · question '+(qinfo.pos+1)+' / '+qinfo.total:'')+'</p>';
  q.o.forEach((o,i)=>{h+='<div class="d'+(!open&&i===q.a?" g":"")+'"><span>'+esc(o)+'</span><i style="width:'+(n?Math.max(3,c[i]/n*100):3)+'%"></i><b>'+c[i]+'</b></div>'});
  if(open)h+='<div class="row"><button class="b p" id="rv">Révéler maintenant</button></div>'}
 else h+='<p class="mut">Aucune question envoyée pour l’instant.</p>';
 const sc=ans.map(a=>{const r=a.r||{};let ok=0,k=0;for(const id in r){k++;if(Q[id]&&Q[id].a===r[id])ok++}return{id:a.id,n:a.name||"?",ok,k}}).sort((a,b)=>b.ok-a.ok||a.k-b.k);
 h+='<div class="hrow" style="margin-top:18px"><h2 style="margin:0">Classement ('+sc.length+')</h2><button class="b s" id="lb">'+(showLb?'Masquer':'Afficher')+'</button></div>'+(!showLb?'<p class="mut">Classement masqué.</p>':sc.length?'<table class="lead">'+sc.map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(s.n)+'</td><td>'+s.ok+' / '+s.k+'</td><td style="width:1%"><button class="b s" data-k="'+esc(s.id)+'" data-n="'+esc(s.n)+'" aria-label="Retirer '+esc(s.n)+'">Retirer</button></td></tr>').join("")+'</table>':'<p class="mut">Aucun stagiaire connecté.</p>')+'<div class="row"><button class="b" id="rs">Remise à zéro</button></div>';
 el.innerHTML=h;
 if($("#rv"))$("#rv").onclick=reveal;
 $("#lb").onclick=()=>{showLb=!showLb;live()};
 el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{if(confirm("Retirer "+b.dataset.n+" du classement ?"))api("kick",{id:b.dataset.k}).catch(()=>toast("Action impossible"))});
 $("#rs").onclick=()=>{const b=$("#rs");if(Date.now()<rsT){rsT=0;reset()}else{rsT=Date.now()+4000;b.textContent="Touche encore pour confirmer"}}}

/* ---------- Stagiaire ---------- */
function tr(){const v=$("#tv");if(!v)return;
if(!name){if($("#nm"))return;
  v.innerHTML='<div class="card"><h2>Rejoindre la séance</h2>'+(isT?'':'<input type="text" id="cd2" inputmode="numeric" maxlength="10" placeholder="Code de la séance">')+'<input type="text" id="nm" maxlength="30" placeholder="Prénom Nom" autocomplete="name"><button class="b p" id="ok">Rejoindre</button></div>';
  const go=async()=>{const x=$("#nm").value.trim(),c=isT?"":$("#cd2").value.trim();if(!x){toast("Saisis ton nom.");return}if(!isT&&!c){toast("Saisis le code.");return}
   try{await join(c,x)}catch(e){toast(e.message||"Connexion impossible");return}
   name=x;try{localStorage.setItem("pse_name",x)}catch(e){}tr()};
  $("#ok").onclick=go;$("#nm").onkeydown=e=>{if(e.key==="Enter")go()};return}
 if(!sess){v.innerHTML='<div class="card wait"><div class="pulse"></div><h2>En attente du formateur</h2><p class="mut" style="margin:0">Connecté·e : '+esc(name)+'</p></div>';return}
 const q=Q[sess.id],closed=sess.state==="closed",m=mine[sess.id];
 const act=!closed&&m===undefined&&Date.now()<endAt;
 let h='<div class="card">';
 if(!closed)h+='<div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="rg" cx="50" cy="50" r="42" transform="rotate(-90 50 50)"/></svg><b id="tl">'+T+'</b></div>';
 h+='<span class="chip">'+esc(q.th)+'</span><p class="q">'+esc(q.q)+'</p>';
 q.o.forEach((o,i)=>{let c="o";if(closed){if(i===q.a)c+=" ok";else if(m===i)c+=" ko"}else if(m===i)c+=" sel";
  h+='<button class="'+c+'" data-a="'+i+'"'+(act?"":" disabled")+'><span class="k">'+"ABCD"[i]+'</span><span>'+esc(o)+'</span></button>'});
 if(closed)h+='<div class="res '+(m===q.a?"ok":"ko")+'">'+(m===undefined?"Pas de réponse : temps écoulé.":m===q.a?"✓ Bonne réponse":"✗ Mauvaise réponse, la bonne est en vert.")+'</div>';
 else if(m!==undefined)h+='<div class="res">Réponse enregistrée. Attends la correction.</div>';
 else if(!act)h+='<div class="res ko">Temps écoulé. Attends la correction.</div>';
 const k=Object.keys(mine),ok=k.filter(i=>Q[i]&&Q[i].a===mine[i]).length;
 h+='<p class="mut" style="margin:6px 0 0">Ton score : <b>'+ok+' / '+k.length+'</b></p></div>';
 v.innerHTML=h;
 v.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(+b.dataset.a));
 tick()}
async function answer(i){if(!sess||sess.state!=="open"||mine[sess.id]!==undefined||Date.now()>=endAt)return;
 mine[sess.id]=i;tr();
 try{await api("answer",{uid,q:sess.id,a:i})}catch(e){delete mine[sess.id];tr();toast("Réponse non enregistrée, réessaie.")}}
function tick(){
 if(isT&&sess&&sess.state==="open"&&$("#cd"))$("#cd").textContent=Math.max(0,Math.ceil(T-(Date.now()+off-sess.t)/1000));
 const left=Math.max(0,(endAt-Date.now())/1000);
 const rg=$("#rg");
 if(rg){rg.style.strokeDashoffset=264*(1-left/T);rg.setAttribute("class","fg"+(left<=5?" r":left<=10?" w":""));$("#tl").textContent=Math.ceil(left)}
 const a=left>0;if(wasAct&&!a&&sess&&sess.state==="open")tr();wasAct=a}
init();
</script></body></html>
